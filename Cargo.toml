[package]
name = "rusty-conduit-engine"
version = "0.5.1"
edition = "2021"
description = "Shared proxy and routing engine for the rusty-conduit CLI family (pure-Rust TLS/crypto)"
license = "BSD-3-Clause"

[lib]
name = "rusty_conduit_engine"
path = "src/lib.rs"

[features]
default = ["routing"]
routing = ["dep:regex"]

[dependencies]
# Async runtime & utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"

# HTTP
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
# Already in the graph through hyper; read directly only to classify upstream HTTP/2
# stream errors (GOAWAY / REFUSED_STREAM) when deciding whether a request may be resent.
h2 = "0.4"

# TLS & certificates (pure-Rust stack; `ring` provider, no OpenSSL / aws-lc)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
p12-keystore = "0.4"
x509-parser = "0.18"

# Sockets (TCP keepalive tuning)
socket2 = "0.6"

# Concurrency
dashmap = "6"
# Lock-free hot-reload snapshots.
arc-swap = "1"

# Rule matching
# `regex` for host/URL regex rules (behind the `routing` feature); `base64` for HTTP `Proxy-Authorization`.
regex = { version = "1", optional = true }
base64 = "0.22"

# Config & Time
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
# `local-offset` provides the local timezone needed for weekday/time routing rules.
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

# Errors
thiserror = "2"

[dev-dependencies]
# `all` exposes the keepalive getters used to verify socket options in tests.
socket2 = { version = "0.6", features = ["all"] }
# Unit tests build `RoutingInput` from TOML snippets.
toml = "1"
